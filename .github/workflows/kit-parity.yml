name: Kit Parity

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: Vendored kit staleness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Compare the vendored kit against platform-ops main
        run: npm run check:kit -- --strict-remote
