name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action calls GET /pulls/{n}/commits to scope its scan to the PR's
    # own commits. The workflow-level `contents: read` above doesn't cover that
    # call, and Dependabot-triggered runs get no implicit permissions beyond
    # what's declared here — every Dependabot PR failed this job with a 403
    # until this was added.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history: a secret committed months ago and deleted last week is
          # still in the pack file and still leaked.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # rust-toolchain.toml pins the channel and requests rustfmt and clippy,
      # so the action installs exactly what the repository asks for.
      - name: Install toolchain
        run: rustup show

      # rdkafka's cmake-build feature compiles librdkafka from source, and its
      # SASL OAUTHBEARER/OIDC support includes curl.h unconditionally even with
      # -DWITH_CURL=0 passed — the dev headers just need to be present, whether
      # or not curl ends up linked. Not on the runner by default.
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  typescript:
    name: TypeScript (format + typecheck + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:control-plane && npm run build:operator-console

      - name: Test
        run: npm run test:control-plane && npm run test:operator-console

  compose-validation:
    name: Compose Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The app compose file references the shared platform network, which does
      # not exist on a runner — create it so `config` can render.
      - name: Create shared network
        run: docker network create platform_ops_shared || true

      - name: Render compose manifests
        run: |
          for f in docker/compose.app.*.yml; do
            echo "rendering $f"
            # docker/.env.app.local.example carries safe placeholders for the
            # secrets the compose file requires (OPENBAO_TOKEN, POSTGRES_PASSWORD)
            # so this validates interpolation and structure without a real one.
            docker compose --env-file docker/.env.app.local.example -f "$f" config >/dev/null
          done

  security-supply-chain:
    name: Security + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      # A copyleft licence arriving through a transitive dependency can oblige
      # you to publish source you never intended to. Checked on every build
      # because the dangerous moment is when a licence *changes*.
      - name: Licence check (prod dependencies)
        run: node ./scripts/check-licences.mjs .

      - name: Audit dependencies (prod only, high+)
        run: npm run audit:prod:gate

      - name: Build prod images
        run: |
          docker build -f apps/control-plane/Dockerfile --target prod -t trading-bot-control-plane:ci . &
          pid_0=$!
          wait "$pid_0"

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (trading-bot-control-plane:ci)
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0
        with:
          image: trading-bot-control-plane:ci
          format: spdx-json
          output-file: artifacts/sbom-trading-bot-control-plane.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM files
        run: |
          test -s artifacts/sbom-trading-bot-control-plane.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-trading-bot-control-plane.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom
          path: |
            artifacts/sbom-trading-bot-control-plane.spdx.json
          if-no-files-found: error

      - name: Trivy scan (trading-bot-control-plane:ci)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: trading-bot-control-plane:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep rather than CodeQL: CodeQL code scanning on a *private* repository
    # requires GitHub Code Security, a paid add-on. The CodeQL workflow beside
    # this one is gated on `!repository.private` for that reason and never runs.
    # Semgrep needs no add-on, so this is the job that actually scans.
    #
    # Findings fail the build and appear in the job log. Uploading SARIF to the
    # Security tab needs the same paid add-on, so the log is the report.
    #
    # Excluded rules, each reviewed rather than waved through:
    #   missing-user: container hardening — backlog
    #   missing-user-entrypoint: container hardening — backlog
    #   writable-filesystem-service: container hardening — backlog
    #   no-new-privileges: container hardening — backlog
    #   ifs-tampering: IFS is saved and restored around the loop
    #   detected-generic-secret: entropy heuristic; gitleaks already covers secrets
    #   prototype-pollution-loop: read-only tree walks, guarded with hasOwnProperty; no assignment
    #   incomplete-sanitization: stripping '%' from a formatted percentage, not sanitisation
    #   detect-non-literal-regexp: locale comes from a fixed list, in a build script
    #   aws-subnet-has-public-ip-address: single public host by design; there is no NAT gateway
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Scan
        # `semgrep scan`, not `semgrep ci`: the latter expects a Semgrep AppSec
        # Platform token and behaves differently without one. `--error` is what
        # turns a finding into a failed job rather than a printed note.
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --config p/rust \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
