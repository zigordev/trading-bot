name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # rust-toolchain.toml pins the channel and requests rustfmt and clippy,
      # so the action installs exactly what the repository asks for.
      - name: Install toolchain
        run: rustup show

      # rdkafka's cmake-build feature compiles librdkafka from source, and its
      # SASL OAUTHBEARER/OIDC support includes curl.h unconditionally even with
      # -DWITH_CURL=0 passed — the dev headers just need to be present, whether
      # or not curl ends up linked. Not on the runner by default.
      - name: Install librdkafka build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      # release-please bumps the workspace version in Cargo.toml and, through
      # its Cargo.lock extra-files entries, the five crates' lock versions. If a
      # future release-please stops matching those entries it logs a warning and
      # carries on, so the lock would drift again silently. --locked refuses a
      # lock that disagrees with the manifests, which turns that into a failure.
      - name: Cargo.lock matches Cargo.toml
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install coverage tooling
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-llvm-cov

      # cargo llvm-cov runs the suite, so this replaces `cargo test` rather
      # than adding a second compile of every crate.
      - name: Test with coverage
        run: |
          mkdir -p artifacts
          cargo llvm-cov --workspace --lcov --output-path artifacts/lcov.info

      - name: Upload rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: artifacts/lcov.info
          retention-days: 7
          if-no-files-found: warn

  typescript:
    name: TypeScript (format + typecheck + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:control-plane && npm run build:operator-console

      - name: Test
        run: npm run test:control-plane && npm run test:operator-console

  integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Run integration suite
        run: npm run test:integration

      - name: Compose logs
        if: failure()
        run: docker compose -f docker/compose.ci.yml logs --no-color

  compose-validation:
    name: Compose Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # The app compose file references the shared platform network, which does
      # not exist on a runner — create it so `config` can render.
      - name: Create shared network
        run: docker network create platform_ops_shared || true

      - name: Render compose manifests
        run: |
          for f in docker/compose.app.*.yml; do
            echo "rendering $f"
            # docker/.env.app.local.example carries safe placeholders for the
            # secrets the compose file requires (OPENBAO_TOKEN, POSTGRES_PASSWORD)
            # so this validates interpolation and structure without a real one.
            docker compose --env-file docker/.env.app.local.example -f "$f" config >/dev/null
          done

  security-supply-chain:
    name: Security + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      # A copyleft licence arriving through a transitive dependency can oblige
      # you to publish source you never intended to. Checked on every build
      # because the dangerous moment is when a licence *changes*.
      - name: Licence check (prod dependencies)
        run: node ./scripts/check-licences.mjs .

      - name: Audit dependencies (prod only, high+)
        run: npm run audit:prod:gate

  image-supply-chain:
    name: Image SBOM + Trivy (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: control-plane
            dockerfile: apps/control-plane/Dockerfile
            target: prod
          - image: operator-console
            dockerfile: apps/operator-console/Dockerfile
            target: local
          - image: market-data
            dockerfile: crates/market-data/Dockerfile
            target: local
          - image: execution
            dockerfile: crates/execution/Dockerfile
            target: local
          - image: research-backtesting
            dockerfile: crates/research-backtesting/Dockerfile
            target: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # One runner per image: the three Rust images compile the whole workspace
      # from source, so building them in sequence would cost more wall clock
      # than the rest of CI put together.
      #
      # Only the control-plane names its runtime stage `prod`, which is the
      # estate convention; the other four call it `local`.
      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            --target ${{ matrix.target }} \
            -t trading-bot-${{ matrix.image }}:ci .

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0
        with:
          image: trading-bot-${{ matrix.image }}:ci
          format: spdx-json
          output-file: artifacts/sbom-trading-bot-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM
        run: |
          file=artifacts/sbom-trading-bot-${{ matrix.image }}.spdx.json
          test -s "$file"
          jq -e '.spdxVersion and (.packages | type == "array")' "$file"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: artifacts/sbom-trading-bot-${{ matrix.image }}.spdx.json
          retention-days: 30
          if-no-files-found: error

      # Twice on purpose: the JSON run records what was found and never fails,
      # so the artifact exists even when the gate below stops the build. The
      # vulnerability database is cached after the first scan.
      - name: Trivy report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trading-bot-${{ matrix.image }}:ci
          format: json
          output: artifacts/trivy-trading-bot-${{ matrix.image }}.json
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image }}
          path: artifacts/trivy-trading-bot-${{ matrix.image }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trading-bot-${{ matrix.image }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --config p/rust \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
