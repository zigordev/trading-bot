name: Auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge (Dependabot, patch/minor only)
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is not set. Merging with GITHUB_TOKEN, so the push to main will trigger no workflows — release-please and CodeQL on main will not run. See the comment in .github/workflows/auto-merge.yml."
          fi
          gh pr merge --auto --squash "$PR_URL"

  everyone-else:
    name: Auto-merge
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN is not set. Merging with GITHUB_TOKEN, so the push to main will trigger no workflows — release-please and CodeQL on main will not run. See the comment in .github/workflows/auto-merge.yml."
          fi
          gh pr merge --auto --squash "$PR_URL"
