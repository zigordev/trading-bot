name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  HUSKY: '0'

jobs:
  analyze:
    name: Analyze
    # Code scanning upload needs GitHub Advanced Security, a paid add-on on a
    # private repo. Without this guard the job runs the full analysis and only
    # fails at the very last step ("Code scanning is not enabled for this
    # repository") — every other repo in the estate already skips instead.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
