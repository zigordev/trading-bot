name: Deploy AWS App (EC2 Compose, manual dispatch only)

run-name: >-
  Deploy ${{ inputs.release_tag }} — needs a host with >= 16 GiB RAM free;
  the shared t3.large cannot run this stack

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (example: v0.1.20)'
        required: true
        type: string
      capacity_confirmed:
        description: >-
          The target host has at least 16 GiB of RAM free for trading-bot alone.
          This stack measured ~10.6 GiB resident (ClickHouse ~5.57 GiB of it).
          The shared production host is one t3.large (8 GiB) already running 23
          containers, so it cannot host this. Resize first, then tick this box.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-aws-prod-trading-bot
  cancel-in-progress: false

jobs:
  capacity-gate:
    name: Capacity Gate
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 5

    steps:
      - name: State the capacity requirement
        env:
          CAPACITY_CONFIRMED: ${{ inputs.capacity_confirmed }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          {
            echo "## trading-bot production capacity"
            echo
            echo "| measurement | value |"
            echo "| --- | --- |"
            echo "| stack resident memory, measured locally | ~10.6 GiB |"
            echo "| ClickHouse historical store alone | ~5.57 GiB |"
            echo "| containers in this stack | 7 |"
            echo "| shared production host | one t3.large, 2 vCPU / 8 GiB |"
            echo "| containers already on that host | 23 |"
            echo
            echo "A t3.large cannot host this. t3.xlarge (4 vCPU / 16 GiB) leaves"
            echo "no headroom once the 23 existing containers are counted, so the"
            echo "first size that actually fits is t3.2xlarge (8 vCPU / 32 GiB)."
            echo
            echo "This workflow has no release or push trigger on purpose: merging"
            echo "a pull request or cutting a release cannot deploy trading-bot."
            echo
            echo "Requested release: \`${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CAPACITY_CONFIRMED" != "true" ]; then
            echo "Capacity not confirmed. Resize the host to at least 32 GiB and dispatch again with the box ticked." >&2
            exit 1
          fi

  build-and-push:
    permissions:
      contents: read
      id-token: write
    name: Build + Push + Bundle
    runs-on: ubuntu-latest
    environment: production
    needs: capacity-gate
    timeout-minutes: 180

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      control_plane_ref: ${{ steps.digests.outputs.control_plane_ref }}
      operator_console_ref: ${{ steps.digests.outputs.operator_console_ref }}
      market_data_ref: ${{ steps.digests.outputs.market_data_ref }}
      research_backtesting_ref: ${{ steps.digests.outputs.research_backtesting_ref }}
      execution_ref: ${{ steps.digests.outputs.execution_ref }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          raw_tag="$INPUT_TAG"

          if [ -z "$raw_tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi

          safe_tag="$(printf '%s' "$raw_tag" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
          if [ -z "$safe_tag" ]; then
            echo "Release tag '$raw_tag' became empty after sanitization" >&2
            exit 1
          fi

          echo "release_tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$safe_tag" >> "$GITHUB_OUTPUT"

      - name: Validate required deploy variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_CONTROL_PLANE_REPOSITORY_URI: ${{ vars.AWS_ECR_CONTROL_PLANE_REPOSITORY_URI }}
          AWS_ECR_OPERATOR_CONSOLE_REPOSITORY_URI: ${{ vars.AWS_ECR_OPERATOR_CONSOLE_REPOSITORY_URI }}
          AWS_ECR_MARKET_DATA_REPOSITORY_URI: ${{ vars.AWS_ECR_MARKET_DATA_REPOSITORY_URI }}
          AWS_ECR_RESEARCH_BACKTESTING_REPOSITORY_URI: ${{ vars.AWS_ECR_RESEARCH_BACKTESTING_REPOSITORY_URI }}
          AWS_ECR_EXECUTION_REPOSITORY_URI: ${{ vars.AWS_ECR_EXECUTION_REPOSITORY_URI }}
          AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          AWS_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          AWS_SSM_APP_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ECR_CONTROL_PLANE_REPOSITORY_URI
            AWS_ECR_OPERATOR_CONSOLE_REPOSITORY_URI
            AWS_ECR_MARKET_DATA_REPOSITORY_URI
            AWS_ECR_RESEARCH_BACKTESTING_REPOSITORY_URI
            AWS_ECR_EXECUTION_REPOSITORY_URI
            AWS_DEPLOY_BUCKET
            AWS_DEPLOY_INSTANCE_ID
            AWS_SSM_APP_PREFIX
          )

          for name in "${required[@]}"; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "Missing GitHub environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Load console build variables from docker/.env.app.prod
        run: |
          set -euo pipefail

          APP_ENV_FILE="docker/.env.app.prod"
          if [ ! -f "$APP_ENV_FILE" ]; then
            echo "Missing app env template in repository: $APP_ENV_FILE" >&2
            exit 1
          fi

          base_url="$(grep -E '^NEXT_PUBLIC_CONTROL_PLANE_BASE_URL=' "$APP_ENV_FILE" | tail -n1 | cut -d'=' -f2- || true)"
          if [ -z "$base_url" ]; then
            echo "Missing required key in $APP_ENV_FILE: NEXT_PUBLIC_CONTROL_PLANE_BASE_URL" >&2
            exit 1
          fi

          echo "NEXT_PUBLIC_CONTROL_PLANE_BASE_URL=$base_url" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build + push service images
        env:
          CONTROL_PLANE_REPOSITORY: ${{ vars.AWS_ECR_CONTROL_PLANE_REPOSITORY_URI }}
          OPERATOR_CONSOLE_REPOSITORY: ${{ vars.AWS_ECR_OPERATOR_CONSOLE_REPOSITORY_URI }}
          MARKET_DATA_REPOSITORY: ${{ vars.AWS_ECR_MARKET_DATA_REPOSITORY_URI }}
          RESEARCH_BACKTESTING_REPOSITORY: ${{ vars.AWS_ECR_RESEARCH_BACKTESTING_REPOSITORY_URI }}
          EXECUTION_REPOSITORY: ${{ vars.AWS_ECR_EXECUTION_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          set -euo pipefail

          build_and_push() {
            local key="$1"
            local dockerfile="$2"
            shift 2

            local repository
            repository="$(printenv "${key}_REPOSITORY")"
            local image="${repository}:${IMAGE_TAG}"
            local repo_name="${repository#*/}"

            if aws ecr describe-images --repository-name "$repo_name" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
              echo "Image already exists in ECR with immutable tag, reusing: $image"
              return 0
            fi

            docker build -f "$dockerfile" --target prod "$@" -t "$image" .
            docker push "$image"
          }

          build_and_push CONTROL_PLANE apps/control-plane/Dockerfile
          build_and_push MARKET_DATA crates/market-data/Dockerfile
          build_and_push RESEARCH_BACKTESTING crates/research-backtesting/Dockerfile
          build_and_push EXECUTION crates/execution/Dockerfile
          build_and_push OPERATOR_CONSOLE apps/operator-console/Dockerfile \
            --build-arg NEXT_PUBLIC_CONTROL_PLANE_BASE_URL="$NEXT_PUBLIC_CONTROL_PLANE_BASE_URL" \
            --build-arg NEXT_PUBLIC_RELEASE="$RELEASE_TAG"

      - name: Resolve pushed image digests
        id: digests
        env:
          CONTROL_PLANE_REPOSITORY: ${{ vars.AWS_ECR_CONTROL_PLANE_REPOSITORY_URI }}
          OPERATOR_CONSOLE_REPOSITORY: ${{ vars.AWS_ECR_OPERATOR_CONSOLE_REPOSITORY_URI }}
          MARKET_DATA_REPOSITORY: ${{ vars.AWS_ECR_MARKET_DATA_REPOSITORY_URI }}
          RESEARCH_BACKTESTING_REPOSITORY: ${{ vars.AWS_ECR_RESEARCH_BACKTESTING_REPOSITORY_URI }}
          EXECUTION_REPOSITORY: ${{ vars.AWS_ECR_EXECUTION_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail

          resolve() {
            local key="$1"
            local repo_uri
            repo_uri="$(printenv "${key}_REPOSITORY")"
            local repo_name="${repo_uri#*/}"
            local digest
            digest="$(aws ecr describe-images \
              --repository-name "$repo_name" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"

            if [ -z "$digest" ] || [ "$digest" = "None" ]; then
              echo "Could not resolve digest for ${repo_uri}:${IMAGE_TAG}" >&2
              exit 1
            fi

            local output_key
            output_key="$(printf '%s' "$key" | tr '[:upper:]' '[:lower:]')_ref"
            echo "${output_key}=${repo_uri}@${digest}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${key}: ${repo_uri}@${digest}"
          }

          resolve CONTROL_PLANE
          resolve OPERATOR_CONSOLE
          resolve MARKET_DATA
          resolve RESEARCH_BACKTESTING
          resolve EXECUTION

      - name: Trivy scan (control plane)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.control_plane_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (operator console)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.operator_console_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (market data)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.market_data_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (research backtesting)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.research_backtesting_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Trivy scan (execution)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.digests.outputs.execution_ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM (control plane)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.digests.outputs.control_plane_ref }}
          format: spdx-json
          output-file: artifacts/sbom-control-plane.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (operator console)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.digests.outputs.operator_console_ref }}
          format: spdx-json
          output-file: artifacts/sbom-operator-console.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (market data)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.digests.outputs.market_data_ref }}
          format: spdx-json
          output-file: artifacts/sbom-market-data.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (research backtesting)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.digests.outputs.research_backtesting_ref }}
          format: spdx-json
          output-file: artifacts/sbom-research-backtesting.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM (execution)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.digests.outputs.execution_ref }}
          format: spdx-json
          output-file: artifacts/sbom-execution.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM files
        run: |
          set -euo pipefail
          for name in control-plane operator-console market-data research-backtesting execution; do
            file="artifacts/sbom-${name}.spdx.json"
            test -s "$file"
            jq -e '.spdxVersion and (.packages | type == "array")' "$file" > /dev/null
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images (keyless)
        env:
          IMAGES: >-
            ${{ steps.digests.outputs.control_plane_ref }}
            ${{ steps.digests.outputs.operator_console_ref }}
            ${{ steps.digests.outputs.market_data_ref }}
            ${{ steps.digests.outputs.research_backtesting_ref }}
            ${{ steps.digests.outputs.execution_ref }}
        run: |
          set -euo pipefail
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            cosign sign --yes "$image"
            echo "signed: $image"
          done

      - name: Attach SLSA provenance
        env:
          IMAGES: >-
            ${{ steps.digests.outputs.control_plane_ref }}
            ${{ steps.digests.outputs.operator_console_ref }}
            ${{ steps.digests.outputs.market_data_ref }}
            ${{ steps.digests.outputs.research_backtesting_ref }}
            ${{ steps.digests.outputs.execution_ref }}
          BUILD_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cat > /tmp/provenance.json <<JSON
          {
            "buildType": "https://github.com/actions/runner",
            "builder": { "id": "https://github.com/${BUILD_REPO}/actions/runs/${BUILD_RUN}" },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${BUILD_REPO}@${BUILD_REF}",
                "digest": { "sha1": "${BUILD_SHA}" },
                "entryPoint": ".github/workflows/deploy.yml"
              }
            }
          }
          JSON
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            cosign attest --yes --predicate /tmp/provenance.json --type slsaprovenance "$image"
            echo "attested: $image"
          done

      - name: Attach SBOM attestations
        env:
          CONTROL_PLANE_REF: ${{ steps.digests.outputs.control_plane_ref }}
          OPERATOR_CONSOLE_REF: ${{ steps.digests.outputs.operator_console_ref }}
          MARKET_DATA_REF: ${{ steps.digests.outputs.market_data_ref }}
          RESEARCH_BACKTESTING_REF: ${{ steps.digests.outputs.research_backtesting_ref }}
          EXECUTION_REF: ${{ steps.digests.outputs.execution_ref }}
        run: |
          set -euo pipefail
          attest() {
            local key="$1"
            local name="$2"
            local ref
            ref="$(printenv "${key}_REF")"
            cosign attest --yes --predicate "artifacts/sbom-${name}.spdx.json" --type spdxjson "$ref"
            echo "sbom attested: $ref"
          }

          attest CONTROL_PLANE control-plane
          attest OPERATOR_CONSOLE operator-console
          attest MARKET_DATA market-data
          attest RESEARCH_BACKTESTING research-backtesting
          attest EXECUTION execution

      - name: Package tracked files into deploy bundle
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git archive --format=tar.gz --output "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" HEAD

      - name: Upload deploy bundle to S3
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp \
            "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" \
            "s3://${DEPLOY_BUCKET}/releases/trading-bot/${IMAGE_TAG}/deploy-bundle.tar.gz"

  deploy-app:
    permissions:
      contents: read
      id-token: write
    name: Remote App Deploy via SSM
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push
    timeout-minutes: 60

    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Execute remote app deploy command
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          APP_SSM_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          CONTROL_PLANE_IMAGE: ${{ needs.build-and-push.outputs.control_plane_ref }}
          OPERATOR_CONSOLE_IMAGE: ${{ needs.build-and-push.outputs.operator_console_ref }}
          MARKET_DATA_IMAGE: ${{ needs.build-and-push.outputs.market_data_ref }}
          RESEARCH_BACKTESTING_IMAGE: ${{ needs.build-and-push.outputs.research_backtesting_ref }}
          EXECUTION_IMAGE: ${{ needs.build-and-push.outputs.execution_ref }}
        run: |
          set -euo pipefail
          payload_file="$(mktemp)"

          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg region "$AWS_REGION" \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg release "$RELEASE_TAG" \
            --arg control_plane_image "$CONTROL_PLANE_IMAGE" \
            --arg operator_console_image "$OPERATOR_CONSOLE_IMAGE" \
            --arg market_data_image "$MARKET_DATA_IMAGE" \
            --arg research_backtesting_image "$RESEARCH_BACKTESTING_IMAGE" \
            --arg execution_image "$EXECUTION_IMAGE" \
            --arg app_prefix "$APP_SSM_PREFIX" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [
                  "set -euo pipefail",
                  "BASE_DIR=\"/opt/trading-bot\"",
                  "RELEASE_DIR=\"$BASE_DIR/releases/\($release)\"",
                  "mkdir -p \"$BASE_DIR/releases\"",
                  "rm -rf \"$RELEASE_DIR\"",
                  "mkdir -p \"$RELEASE_DIR\"",
                  "aws s3 cp \"s3://\($bucket)/releases/trading-bot/\($release)/deploy-bundle.tar.gz\" \"/tmp/trading-bot-\($release).tar.gz\" --region \($region)",
                  "tar -xzf \"/tmp/trading-bot-\($release).tar.gz\" -C \"$RELEASE_DIR\"",
                  "cd \"$RELEASE_DIR\"",
                  "chmod +x scripts/prod-deploy-remote.sh",
                  "./scripts/prod-deploy-remote.sh --release-dir \"$RELEASE_DIR\" --region \"\($region)\" --app-ssm-prefix \"\($app_prefix)\" --control-plane-image \"\($control_plane_image)\" --operator-console-image \"\($operator_console_image)\" --market-data-image \"\($market_data_image)\" --research-backtesting-image \"\($research_backtesting_image)\" --execution-image \"\($execution_image)\" --release-tag \"\($release)\""
                ]
              }
            }' > "$payload_file"

          command_id="$(aws ssm send-command --cli-input-json "file://${payload_file}" --query 'Command.CommandId' --output text)"

          echo "SSM command id: $command_id"

          max_attempts=180
          sleep_seconds=10
          status=""
          status_details=""
          invocation_available="false"

          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            invocation_json="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>&1)"
            rc=$?
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "poll[$attempt/$max_attempts]: invocation not ready yet"
            else
              invocation_available="true"
              status="$(printf '%s' "$invocation_json" | jq -r '.Status')"
              status_details="$(printf '%s' "$invocation_json" | jq -r '.StatusDetails')"
              echo "poll[$attempt/$max_attempts]: status=$status details=$status_details"

              case "$status" in
                Success|Cancelled|TimedOut|Failed|Cancelling)
                  break
                  ;;
              esac
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$sleep_seconds"
            fi
          done

          if [ "$invocation_available" != "true" ]; then
            echo "Unable to read SSM command invocation details (command_id=$command_id)" >&2
            exit 1
          fi

          echo "Command status: $status"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode,ExecutionStartDateTime:ExecutionStartDateTime,ExecutionEndDateTime:ExecutionEndDateTime,StandardOutputUrl:StandardOutputUrl,StandardErrorUrl:StandardErrorUrl}' --output json || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true

          if [ "$status" != "Success" ]; then
            echo "Remote app deployment failed (status=$status, status_details=$status_details)" >&2
            exit 1
          fi

  post-deploy-smoke:
    name: Post Deploy Smoke
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-app
    timeout-minutes: 10

    steps:
      - name: Smoke health check
        if: ${{ vars.DEPLOY_HEALTHCHECK_URL != '' }}
        env:
          HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          body="$(curl -fsS "$HEALTHCHECK_URL")"
          printf '%s\n' "$body" > /dev/null
          echo "Health check passed: $HEALTHCHECK_URL"
