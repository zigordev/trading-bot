version: 2

# Grouped and weekly on purpose: a daily stream of single-package PRs is
# noise that gets ignored, which is the same outcome as having no updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /apps/control-plane
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
