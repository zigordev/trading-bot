      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /crates/research-backtesting
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
