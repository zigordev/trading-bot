version: 2

# Grouped and weekly on purpose: a daily stream of single-package PRs is
# noise that gets ignored, which is the same outcome as having no updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # vitest ships as a family that must move together. @vitest/coverage-v8
      # and @vitest/ui both peer-depend on an exact vitest version, so a
      # single-package major does not resolve at all — coverage-v8@4 wanting
      # vitest@4.1.11 against ui@3.2.7 wanting vitest@3.2.7 is not a risky
      # merge, it is an impossible one. Same shape as the @nestjs group above.
      vitest:
        patterns: ['vitest', '@vitest/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # The RustCrypto crates share the `digest` trait crate, and bumping one
      # alone puts two incompatible versions of it in the graph:
      #
      #   error[E0277]: the trait bound `sha2::Sha256: hmac::digest::core_api::CoreProxy`
      #                 is not satisfied
      #   note: there are multiple different versions of crate `digest` in the
      #         dependency graph
      #
      # sha2 0.11 and hmac 0.13 each failed on their own for exactly this.
      rustcrypto:
        patterns: ['sha2', 'hmac', 'digest', 'sha1', 'hkdf', 'md-5']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /apps/control-plane
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /apps/operator-console
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /crates/execution
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /crates/market-data
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /crates/research-backtesting
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
