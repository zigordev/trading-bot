[package]
name = "trading-bot-execution"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
chrono = "0.4.42"
futures-util = "0.3.31"
hmac = "0.12.1"
hex = "0.4.3"
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
prometheus = "0.14.0"
trading-bot-observability = { path = "../observability" }
reqwest = { version = "0.12.24", default-features = false, features = ["brotli", "gzip", "http2", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
trading-bot-market-data = { path = "../market-data" }
trading-bot-strategy-engine = { path = "../strategy-engine" }
url = "2.5.7"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
