[package]
name = "trading-bot-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
prometheus = "0.14.0"
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }
opentelemetry-semantic-conventions = "0.33"
tracing-opentelemetry = "0.34"
