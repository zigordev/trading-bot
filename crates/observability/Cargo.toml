[package]
name = "trading-bot-observability"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
prometheus = "0.14.0"
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

# Traces. The collector speaks OTLP over HTTP/protobuf on :4318, which is what
# `http-proto` plus a reqwest client gives; the gRPC transport would need a
# different port and pull in tonic for nothing.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# `reqwest-blocking-client`, not `reqwest-client`. The SDK's batch processor
# runs on its own dedicated thread with no tokio runtime, so the async client
# panics there with "there is no reactor running" — on a background thread,
# where nothing surfaces it. The processor then shuts down and every later span
# is dropped with a warning that blames the application's lifecycle management.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }
opentelemetry-semantic-conventions = "0.32"
tracing-opentelemetry = "0.33"
