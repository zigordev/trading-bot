[package]
name = "trading-bot-research-backtesting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
chrono = { version = "0.4.42", features = ["serde"] }
prometheus = "0.14.0"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
rdkafka = { version = "0.38.0", features = ["cmake-build", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
trading-bot-market-data = { path = "../market-data" }
trading-bot-strategy-engine = { path = "../strategy-engine" }
uuid = { version = "1.18.1", features = ["v4"] }
