[package]
name = "trading-bot-market-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
lru = "0.16.2"
prometheus = "0.14.0"
rdkafka = { version = "0.38.0", features = ["cmake-build", "tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"

[dev-dependencies]
assert-json-diff = "2.0.2"
