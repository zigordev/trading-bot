[package]
name = "trading-bot-market-data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.4", features = ["http1", "json", "tokio"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures-util = "0.3.31"
bytes = "1.11.0"
lru = "0.18.3"
prometheus = "0.14.0"
trading-bot-observability = { path = "../observability" }
rdkafka = { version = "0.39.0", features = ["cmake-build", "tokio"] }
reqwest = { version = "0.12.24", default-features = false, features = ["brotli", "gzip", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["io-util"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.41"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
assert-json-diff = "2.0.2"
